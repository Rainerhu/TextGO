name: build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Build platform'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - windows
          - macos

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            label: 'windows'
            args: ''
          - platform: 'macos-latest'
            label: 'macos-arm'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'
            label: 'macos-intel'
            args: '--target x86_64-apple-darwin'

    runs-on: ${{ matrix.platform }}
    env:
      NODE_OPTIONS: --max_old_space_size=4096

    steps:
      - name: check if should run
        id: check
        shell: bash
        run: |
          INPUT="${{ github.event.inputs.platform }}"
          LABEL="${{ matrix.label }}"
          if [[ "$INPUT" == "all" ]]; then
            echo "skip=false" >> $GITHUB_OUTPUT
          elif [[ "$INPUT" == "windows" && "$LABEL" == "windows" ]]; then
            echo "skip=false" >> $GITHUB_OUTPUT
          elif [[ "$INPUT" == "macos" && "$LABEL" == macos* ]]; then
            echo "skip=false" >> $GITHUB_OUTPUT
          else
            echo "skip=true" >> $GITHUB_OUTPUT
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.skip != 'true'

      - name: setup node
        if: steps.check.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: setup rust
        if: steps.check.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: rust cache
        if: steps.check.outputs.skip != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: install pnpm
        if: steps.check.outputs.skip != 'true'
        run: npm install -g pnpm

      - name: install frontend dependencies
        if: steps.check.outputs.skip != 'true'
        run: pnpm install

      - name: disable updater signing (windows)
        if: steps.check.outputs.skip != 'true' && matrix.label == 'windows'
        shell: pwsh
        run: |
          $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $conf.bundle.createUpdaterArtifacts = $false
          $conf | ConvertTo-Json -Depth 10 | Set-Content src-tauri/tauri.conf.json

      - name: disable updater signing (macos)
        if: steps.check.outputs.skip != 'true' && startsWith(matrix.label, 'macos')
        run: |
          python3 -c "
          import json
          with open('src-tauri/tauri.conf.json', 'r') as f:
              conf = json.load(f)
          conf['bundle']['createUpdaterArtifacts'] = False
          with open('src-tauri/tauri.conf.json', 'w') as f:
              json.dump(conf, f, indent=2)
          "

      - name: build tauri app
        if: steps.check.outputs.skip != 'true'
        run: pnpm tauri build ${{ matrix.args }}

      - name: upload windows artifacts
        if: steps.check.outputs.skip != 'true' && matrix.label == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: TextGO-windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: upload macos artifacts
        if: steps.check.outputs.skip != 'true' && startsWith(matrix.label, 'macos')
        uses: actions/upload-artifact@v4
        with:
          name: TextGO-${{ matrix.label }}
          path: |
            src-tauri/target/*/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
